name: pages

on:
  push:
    branches: [master, main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble site files
        run: |
          mkdir -p stage
          cp -r site/. stage/
          cp install.sh stage/install.sh
          cp install-apt.sh stage/install-apt.sh
          touch stage/.nojekyll
      - uses: actions/upload-artifact@v5
        with:
          name: site
          path: stage/

  deb:
    name: deb (${{ matrix.arch }})
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb
        run: cargo deb --no-strip --target ${{ matrix.target }}
      - name: Stage package
        run: |
          mkdir -p stage/pool/main/s/server-spy
          cp target/${{ matrix.target }}/debian/*.deb stage/pool/main/s/server-spy/
      - uses: actions/upload-artifact@v5
        with:
          name: apt-${{ matrix.arch }}
          path: stage/

  apt:
    name: assemble apt repository
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    needs: deb
    env:
      APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: stage
          merge-multiple: true
      - name: Install apt-ftparchive
        run: sudo apt-get update && sudo apt-get install -y apt-utils
      - name: Generate package index
        run: |
          for arch in amd64 arm64; do
            mkdir -p stage/dists/stable/main/binary-$arch
            apt-ftparchive -a "$arch" packages stage/pool \
              > "stage/dists/stable/main/binary-$arch/Packages"
            gzip -k -9 "stage/dists/stable/main/binary-$arch/Packages"
          done
      - name: Generate Release file
        run: |
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="server-spy" \
            -o APT::FTPArchive::Release::Label="server-spy" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o "APT::FTPArchive::Release::Description=server-spy package repository" \
            release stage/dists/stable > stage/dists/stable/Release
      - name: Sign Release
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          if [ -z "$APT_GPG_KEY" ]; then
            echo "no APT_GPG_KEY secret configured — publishing unsigned"
            exit 0
          fi
          if ! (echo "$APT_GPG_KEY" | gpg --batch --yes --import 2>/dev/null &&
                gpg --batch --yes --armor --detach-sign \
                  -o stage/dists/stable/Release.gpg stage/dists/stable/Release &&
                gpg --batch --yes --clearsign \
                  -o stage/dists/stable/InRelease stage/dists/stable/Release); then
            echo "signing failed (key unusable?) — publishing unsigned"
            exit 0
          fi
          gpg --batch --yes --armor --export > stage/server-spy.gpg.key
          echo "release signed"
      - uses: actions/upload-artifact@v5
        with:
          name: apt-repo
          path: stage/

  deploy:
    name: deploy to gh-pages
    runs-on: ubuntu-latest
    needs: [site, apt]
    if: always() && needs.site.result == 'success' && (needs.apt.result == 'success' || needs.apt.result == 'skipped')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: stage
          merge-multiple: true
      - name: Download apt repo
        if: needs.apt.result == 'success'
        uses: actions/download-artifact@v5
        with:
          name: apt-repo
          path: stage
          merge-multiple: true
      - name: Restore apt repository from previous deploy
        if: needs.apt.result != 'success'
        run: |
          git fetch --depth=1 origin gh-pages:gh-pages || true
          if [ -e gh-pages ]; then
            for item in pool dists server-spy.gpg.key install-apt.sh; do
              if [ -e "gh-pages/$item" ]; then
                mkdir -p stage
                cp -r "gh-pages/$item" stage/
              fi
            done
          fi
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: stage
          publish_branch: gh-pages
          force_orphan: true
