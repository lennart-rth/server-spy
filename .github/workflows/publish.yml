name: publish

on:
  workflow_dispatch:
  push:
    # the crate is published from the same release tags as the binaries;
    # `crates-*` tags are still accepted for crate-only releases
    tags: ["v*", "crates-*"]

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync Cargo.toml/Cargo.lock version with the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#crates-}"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" Cargo.toml
          python3 - "$VERSION" << 'EOF'
          import re, sys
          version = sys.argv[1]
          lock = "Cargo.lock"
          text = open(lock).read()
          text = re.sub(
              r'(name = "server-spy"\nversion = ")[^"]*(")',
              rf'\g<1>{version}\g<2>',
              text,
          )
          open(lock, "w").write(text)
          EOF
          grep -A1 'name = "server-spy"' Cargo.lock | grep version
          grep '^version' Cargo.toml
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty
